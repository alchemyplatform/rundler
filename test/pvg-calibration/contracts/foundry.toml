[profile.default]
src = 'src'
out = 'out'
cache_path = 'cache'
solc_version = '0.8.28'
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
bytecode_hash = 'none'
cbor_metadata = false

[lint]
lint_on_build = false

# EntryPoint v0.7 with the canonical deployment settings (eth-infinitism hardhat.config.ts:
# solc 0.8.23, optimizer 1,000,000 runs, viaIR, default EVM version for 0.8.23).
[profile.entrypoint]
src = 'entrypoint'
out = 'out-entrypoint'
cache_path = 'cache-entrypoint'
solc_version = '0.8.23'
optimizer = true
optimizer_runs = 1000000
via_ir = true
evm_version = 'shanghai'
allow_paths = ['../../../crates/contracts/contracts/v0_7/lib']
remappings = [
    '@account-abstraction/=../../../crates/contracts/contracts/v0_7/lib/account-abstraction/contracts/',
    '@openzeppelin/contracts/=../../../crates/contracts/contracts/v0_7/lib/openzeppelin-contracts/contracts/',
]
