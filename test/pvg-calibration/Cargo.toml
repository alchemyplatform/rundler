[package]
name = "rundler-pvg-calibration"
version = "0.11.0"
edition = "2024"
rust-version = "1.92"
license = "LGPL-3.0-only"
repository = "https://github.com/alchemyplatform/rundler"
description = """
Experiments that measure the gas the EntryPoint does not meter, to calibrate preVerificationGas
"""
publish = false

# Standalone: not a member of the rundler workspace, so its forge build and dependencies stay out
# of normal workspace builds. Dependency versions mirror the rundler workspace's.
[workspace]

[dependencies]
alloy-eips = { version = "1.3.0", features = ["k256", "serde", "std"] }
alloy-json-rpc = "1.3.0"
alloy-network = "1.3.0"
alloy-primitives = { version = "1.5.2", features = ["rand"] }
alloy-provider = { version = "1.3.0", default-features = false, features = ["reqwest", "reqwest-rustls-tls"] }
alloy-rpc-client = "1.3.0"
alloy-rpc-types-eth = "1.3.0"
alloy-signer = "1.3.0"
alloy-signer-local = "1.3.0"
alloy-sol-macro = { version = "1.5.2", features = ["json"] }
alloy-sol-types = "1.5.2"
alloy-transport = "1.3.0"
anyhow = "1.0.89"
clap = { version = "4.5.16", features = ["derive", "env"] }
dotenvy = "0.15.7"
rundler-contracts = { path = "../../crates/contracts" }
rundler-types = { path = "../../crates/types" }
serde = "1.0.210"
serde_json = "1.0.128"
tokio = { version = "1.44.2", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
anyhow = "1.0.89"
serde_json = "1.0.128"
