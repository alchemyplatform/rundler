[package]
name = "rundler-pvg-calibration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = """
Experiments that measure the gas the EntryPoint does not meter, to calibrate preVerificationGas
"""
publish = false

[dependencies]
alloy-eips.workspace = true
alloy-json-rpc.workspace = true
alloy-network.workspace = true
alloy-primitives = { workspace = true, features = ["rand"] }
alloy-provider.workspace = true
alloy-rpc-client.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
alloy-sol-macro = { workspace = true, features = ["json"] }
alloy-sol-types.workspace = true
alloy-transport.workspace = true
anyhow.workspace = true
clap = { version = "4.5.16", features = ["derive", "env"] }
dotenvy = "0.15.7"
rundler-contracts.workspace = true
rundler-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
anyhow.workspace = true
serde_json.workspace = true
